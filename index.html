<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Finora — All-in-One Financial Calculator</title>
    <meta
      name="description"
      content="Free, accurate Indian financial calculators: EPF, income tax, NPS, EMI, SIP, PPF, FD, salary, gratuity, GST, age and more. Plan smarter with year-wise projections and charts."
    />
    <link rel="canonical" href="https://finora.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Finora — All-in-One Financial Calculator" />
    <meta
      property="og:description"
      content="37 accurate financial and utility calculators for India — EPF, income tax, NPS, EMI, SIP, PPF, FD, salary, GST and more."
    />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Finora",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "description": "All-in-one financial and utility calculator platform for India.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app on mount. Visible only if this file is opened
           directly from disk, which is not how this entry point is used. -->
      <div style="max-width: 560px; margin: 12vh auto; padding: 0 20px; font: 15px/1.6 system-ui, sans-serif; color: #101828;">
        <h1 style="font-size: 1.3rem; margin: 0 0 12px;">This is the development entry point</h1>
        <p>It needs the dev server to run. To use Finora:</p>
        <ul style="padding-left: 20px;">
          <li><strong>Just use it:</strong> double-click <code>dist/index.html</code> in this project — that build runs straight from disk, no install needed.</li>
          <li><strong>Develop it:</strong> run <code>npm install</code> then <code>npm run dev</code> and open the URL it prints.</li>
        </ul>
      </div>
    </div>
    <noscript>Finora needs JavaScript enabled to run its calculators.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
